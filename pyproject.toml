[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txnforge"
version = "0.1.0"
description = "Spec-shaped synthetic card transactions with lifecycles, labeled fraud, incidents and a rule validator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
dev = ["pytest", "httpx", "fastapi"]

[project.scripts]
txnforge = "txnforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
